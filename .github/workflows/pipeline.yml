name: 🔄 SDET CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write # Required for peaceiris/actions-gh-pages to push to gh-pages branch

defaults:
  run:
    working-directory: sdet-web-playwright


jobs:
  lint:
    name: 🔍 Run Linter Check
    runs-on: ubuntu-latest
    steps:
      - name: 📁 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: sdet-web-playwright/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run Lint
        run: npm run lint

  performance-tests:
    name: ⚡ Run K6 API Load Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000
    steps:
      - name: 📁 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Install K6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.49.0"

      - name: 🚀 Execute K6 Load Test
        run: |
          K6_WEB_DASHBOARD=true K6_WEB_DASHBOARD_EXPORT=summary.html k6 run tests/performance/search-load-test.js --env API_URL=http://localhost:3000

      - name: 📤 Upload Performance Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-report
          path: sdet-web-playwright/summary.html
          retention-days: 1

  api-tests:
    name: ⚡ Run Playwright API Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000
    steps:
      - name: 📁 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: sdet-web-playwright/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      # Optimized: No browser installation step for API tests!

      - name: 🚀 Execute API Tests
        env:
          API_URL: http://localhost:3000
          UI_URL: http://localhost:3000
        run: npx playwright test --project=api-tests --reporter=blob

      - name: 📤 Upload API Blobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-api
          path: sdet-web-playwright/blob-report/
          retention-days: 1

  ui-tests:
    name: 🌐 Run Playwright UI Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
    needs: lint
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000
    steps:
      - name: 📁 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: sdet-web-playwright/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Execute UI Tests
        shell: bash
        env:
          API_URL: ${{ secrets.API_URL || 'http://juice-shop:3000' }}
          UI_URL: ${{ secrets.UI_URL || 'http://juice-shop:3000' }}
          HOME: /root
        run: |
          # If the repository secret contains localhost, override it to the container hostname
          if [[ "$API_URL" == *"localhost"* || "$API_URL" == *"127.0.0.1"* || "$API_URL" == *"::1"* ]]; then
            echo "⚠️ API_URL secret points to localhost. Overriding to http://juice-shop:3000 for GHA container network."
            export API_URL="http://juice-shop:3000"
          fi
          if [[ "$UI_URL" == *"localhost"* || "$UI_URL" == *"127.0.0.1"* || "$UI_URL" == *"::1"* ]]; then
            echo "⚠️ UI_URL secret points to localhost. Overriding to http://juice-shop:3000 for GHA container network."
            export UI_URL="http://juice-shop:3000"
          fi
          npx playwright test --project=ui-tests-chrome --project=ui-tests-firefox --project=ui-tests-webkit --reporter=blob

      - name: 📤 Upload UI Blobs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-ui
          path: sdet-web-playwright/blob-report/
          retention-days: 1

  publish-report:
    name: 📊 Consolidate & Publish Reports
    runs-on: ubuntu-latest
    needs: [performance-tests, api-tests, ui-tests]
    if: always()
    steps:
      - name: 📁 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: sdet-web-playwright/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📥 Download API blob report
        uses: actions/download-artifact@v4
        with:
          name: blob-report-api
          path: sdet-web-playwright/blob-report-api

      - name: 📥 Download UI blob report
        uses: actions/download-artifact@v4
        with:
          name: blob-report-ui
          path: sdet-web-playwright/blob-report-ui

      - name: 📥 Download Performance HTML report
        uses: actions/download-artifact@v4
        with:
          name: k6-summary-report
          path: sdet-web-playwright/k6-summary-report

      - name: 🔀 Merge Reports
        run: |
          mkdir -p all-blobs
          find blob-report-api blob-report-ui -name "*.zip" -exec cp {} all-blobs/ \;
          npx playwright merge-reports --reporter html ./all-blobs -c playwright.config.ts
          cp k6-summary-report/summary.html playwright-report/k6-report.html

      - name: 📊 Upload Consolidated HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sdet-web-playwright/playwright-report/
          retention-days: 7

      - name: 🚀 Deploy to GitHub Pages
        if: success() || failure() # Deploy report even if some tests fail, allowing visual debugging of the failures
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sdet-web-playwright/playwright-report
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

      - name: 📝 Output Pages URL to Job Summary
        if: success() || failure() # Mostra o link mesmo se os testes falharem
        run: |
          echo "### 📊 Automation Reports Dashboard is Live!" >> $GITHUB_STEP_SUMMARY
          echo "👉 [Click here to view the E2E HTML Report](https://raphaelcarvalho07.github.io/sdet-roadmap-portfolio/)" >> $GITHUB_STEP_SUMMARY
          echo "⚡ [Click here to view the K6 Performance Report](https://raphaelcarvalho07.github.io/sdet-roadmap-portfolio/k6-report.html)" >> $GITHUB_STEP_SUMMARY

