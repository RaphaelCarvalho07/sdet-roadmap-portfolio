name: 📱 Mobile CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - "sdet-mobile-appium/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdet-mobile-appium/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: write # Required for peaceiris/actions-gh-pages to push to gh-pages branch

jobs:
  android-e2e:
    name: 🤖 Android E2E Tests (Headless Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📁 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdet-mobile-appium/package-lock.json

      - name: 📦 Install Mobile Project Dependencies
        working-directory: sdet-mobile-appium
        run: |
          npm ci || npm install
          npx appium driver install uiautomator2

      - name: 🚀 Run Tests on Headless Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          working-directory: sdet-mobile-appium
          script: npm test

      - name: 📊 Generate Allure Report
        if: always()
        working-directory: sdet-mobile-appium
        run: npm run report:generate

      - name: 🚀 Deploy Mobile Allure Report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: sdet-mobile-appium/allure-report
          destination_dir: mobile-report
          keep_files: true

      - name: 📈 Publish Run Summary
        if: always()
        run: |
          echo "### 📱 Mobile Test Execution Completed!" >> $GITHUB_STEP_SUMMARY
          echo "👉 [Click here to view Mobile Allure Report](https://raphaelcarvalho07.github.io/sdet-roadmap-portfolio/mobile-report/)" >> $GITHUB_STEP_SUMMARY
